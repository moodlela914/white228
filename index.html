<html lang="zh-TW">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>白色恐怖：記憶的回聲</title>
    <!-- 使用 Google Fonts 引入 Noto Serif TC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* 整體視覺風格 - 白灰黑 */
        body {
            font-family: 'Noto Serif TC', serif;
            margin: 0;
            padding: 0;
            color: #333; /* 深灰色文字 */
            line-height: 1.8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-y: auto; /* Allow body scroll if content is taller than viewport */

            background-color: #e0e0e0; /* 基礎淺灰色 */
            background-image:
                /* subtle horizontal lines in shades of grey */

                    #e0e0e0,
                    #e0e0e0 1px,
                    #d5d5d5 1px,
                    #d5d5d5 2px

            background-blend-mode: multiply, multiply, screen, normal;
            background-size: 100% 100%, 100% 100%, 200px 200px, 100% 100%;

        }

        /* 全螢幕容器 */
        .screen {
            width: 90%;
            max-width: 800px;
            padding: 40px;
            background-color: rgba(255, 255, 255, 0.9); /* 近乎白色的半透明背景 */
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.15); /* 稍微明顯的陰影 */
            text-align: center;
            position: absolute; /* SPA Positioning */
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 1;
            /* Main screen transition - Faster */
            transition: opacity 1s ease-in-out, transform 1s ease-in-out; /* Reduced duration */
            box-sizing: border-box;
            max-height: 95vh;
            overflow-y: auto;
            border: 1px solid rgba(100, 100, 100, 0.3); /* Subtle grey outer border */
        }

        .screen.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -47%) scale(0.97); /* Adjusted slide/scale for faster transition */
        }

         /* 遊戲畫面內的內容區塊，用於內部切換動畫 */
        #game-screen #story-text,
        #game-screen .historical-fact,
        #game-screen #options-container {
             /* Transition for internal scene changes - Faster */
            transition: opacity 0.8s ease-in-out, transform 0.8s ease-in-out; /* Reduced duration */
        }


        /* 標題 */
        h1, h2 {
            color: #222; /* 深黑色標題 */
            margin-bottom: 25px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
             font-weight: 600; /* Noto Serif TC semi-bold */
        }

        h1 { font-size: 2.8em; }
        h2 { font-size: 2em; }

        /* 劇情文字 */
        #story-text, #ending-text {
            text-align: left;
            margin-bottom: 30px;
            padding: 20px;
            background-color: #f8f8f8; /* 偏白的淺色背景 */
            border-left: 4px solid #888; /* 中灰色左邊框 */
            white-space: pre-wrap;
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.03);
             line-height: 1.9; /* Adjusted line spacing slightly */
        }

        /* 歷史小知識 和 反思區塊 */
        .historical-fact, .reflection {
            text-align: left;
            margin-top: 30px;
            padding: 20px;
            background-color: #eeeeee; /* 淺灰色背景 */
            border: 1px dashed #888; /* 中灰色虛線邊框 */
            font-size: 1em;
            color: #555; /* 保留稍淡的灰色文字 */
            line-height: 1.7;
        }

        /* 將歷史小知識和反思標題文字加粗並變色 */
        .historical-fact #historical-fact-title,
        .reflection #reflection-title {
             font-weight: 600;
             color: #333; /* 與內文一致的深灰色 */
             margin-right: 8px;
        }

        /* 按鈕容器 */
        #options-container {
            margin-top: 40px;
            margin-bottom: 30px;
        }

        /* 按鈕樣式 */
        button {
            display: block;
            width: 100%;
            padding: 18px 25px;
            margin: 12px auto;
            border: 2px solid #888; /* 中灰色邊框 */
            border-radius: 4px;
            background-color: #dddddd; /* 淺灰色背景 */
            color: #444; /* 較深的灰色文字 */
            font-family: 'Noto Serif TC', serif;
            font-size: 1.15em;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease; /* Adjusted hover transition */
            text-align: center;
            font-weight: 400;
        }

        button:hover {
            background-color: #cccccc; /* 滑鼠移過變更深的灰色 */
            transform: translateY(-2px); /* Adjusted lift effect */
        }

        button:active {
            background-color: #666; /* 按下時變為深灰色 */
            color: #eee; /* 按下時文字變淺 */
            transform: translateY(0);
             box-shadow: inset 1px 1px 5px rgba(0,0,0,0.3); /* More pronounced inner shadow on press */
        }

        #back-to-start {
             margin-top: 40px;
             background-color: #555; /* 深灰色背景 */
             color: white; /* 白色文字 */
             border-color: #555; /* 與背景一致的邊框 */
        }

         #back-to-start:hover {
            background-color: #333; /* 滑鼠移過變更深的灰色 */
             border-color: #333;
        }

        /* 結局標題 */
        #ending-title {
            font-size: 2.2em;
            color: #555; /* 結局標題使用中灰色 */
            margin-bottom: 25px;
        }

        /* 響應式調整 */
        @media (max-width: 600px) {
            .screen {
                padding: 25px;
            }
            h1 { font-size: 2.2em; }
            h2 { font-size: 1.7em; }
            button { font-size: 1em; padding: 15px 20px; }
             #story-text, #ending-text, .historical-fact, .reflection {
                 padding: 15px;
             }
        }
    </style>
</head>
<body>

    <!-- 角色選擇畫面 -->
    <div id="start-screen" class="screen">
        <h1>白色恐怖：記憶的回聲</h1>
        <p>選擇一個角色，進入那段歷史的迴廊…</p>
        <button data-character="student">我是大學生</button>
        <button data-character="reporter">我是記者</button>
        <button data-character="teacher">我是老師</button>
    </div>

    <!-- 遊戲劇情畫面 -->
    <div id="game-screen" class="screen hidden">
        <h2 id="character-title"></h2>
        <div id="story-text"></div>
        <div id="options-container">
            <!-- 按鈕選項將由 JavaScript 動態生成 -->
        </div>
         <!-- Moved historical fact to the bottom -->
        <div class="historical-fact"><span id="historical-fact-title">歷史小知識：</span> <span id="historical-fact"></span></div>
    </div>

    <!-- 結局畫面 -->
    <div id="ending-screen" class="screen hidden">
        <h2 id="ending-title"></h2>
        <div id="ending-text"></div>
        <div class="reflection"><span id="reflection-title">歷史反思：</span> <span id="reflection-text"></span></div>
        <button id="back-to-start">回到那一天 (重新開始)</button>
    </div>

    <script>

        // 過渡動畫效果 (主畫面切換) - 時間調整為 1秒
        function transitionScreens(hideScreen, showScreen, callback) {
            // Ensure elements are properly positioned for the transition
             [hideScreen, showScreen].forEach(screen => {
                 screen.style.position = 'absolute';
                 screen.style.top = '50%';
                 screen.style.left = '50%';
                 screen.style.transform = 'translate(-50%, -50%)';
             });

             // Set initial state for the showing screen
             showScreen.style.opacity = '0';
             showScreen.style.transform = 'translate(-50%, -48%) scale(0.98)'; // Starts slightly up/smaller

             // Bring the hiding screen to front briefly during transition
             hideScreen.style.zIndex = 2;
             showScreen.style.zIndex = 1;


            // Trigger hide animation
            hideScreen.style.opacity = '0';
            hideScreen.style.transform = 'translate(-50%, -52%) scale(0.98)'; // Slides slightly down/smaller

            const transitionEndPromise = new Promise(resolve => {
                 const handler = () => {
                    hideScreen.classList.add('hidden'); // Hide display after transition
                    hideScreen.style.opacity = ''; // Reset style
                    hideScreen.style.transform = ''; // Reset style
                    hideScreen.style.zIndex = ''; // Reset z-index

                    hideScreen.removeEventListener('transitionend', handler); // Clean up
                    resolve();
                 };

                if (hideScreen.classList.contains('hidden')) {
                    resolve();
                } else {
                     // Listen for opacity transition end
                     hideScreen.addEventListener('transitionend', handler, { once: true });
                     // Add a fallback timeout - slightly longer than the new transition
                     setTimeout(handler, 1100); // 1.1s fallback
                }
            });


             transitionEndPromise.then(() => {
                // After hiding screen is hidden, show the new screen and trigger its transition
                showScreen.classList.remove('hidden'); // Make target screen visible
                 showScreen.style.zIndex = ''; // Reset z-index

                 // Force reflow to apply starting styles before animating
                 void showScreen.offsetHeight;

                // Trigger show animation
                showScreen.style.opacity = '1';
                showScreen.style.transform = 'translate(-50%, -50%) scale(1)'; // Animate to final position/scale

                if (callback) callback();
            });
        }

            characterTitle.textContent = `${getCharacterName(char)} 的回憶`;
            storyText.textContent = scene.text;
            historicalFactSpan.textContent = scene.historicalFact;
            // historicalFactTitleSpan is static in HTML

            // Clear previous options
            optionsContainer.innerHTML = '';

            // Create buttons for options
            scene.options.forEach(option => {
                const button = document.createElement('button');
                button.textContent = option.text;
                button.dataset.nextScene = option.nextScene;
                button.addEventListener('click', handleOptionClick);
                optionsContainer.appendChild(button);
            });

             // renderScene doesn't handle visibility, transitionScreens or handleOptionClick's timeout does.
        }

        // 渲染結局畫面
        function renderEnding(char, endingId) {
             if (!endings[char] || !endings[char][endingId]) {
                alert("錯誤：找不到結局！(" + char + ":" + endingId + ") 請重新開始。");
                showStartScreen();
                return;
            }

            const ending = endings[char][endingId];

            // Set content
            endingTitle.textContent = ending.title;
            endingText.textContent = ending.text;
            reflectionTextSpan.textContent = ending.reflection;
             // reflectionTitleSpan is static in HTML

            // renderEnding doesn't handle visibility, transitionScreens does.
        }

        // 處理選項點擊
        function handleOptionClick(event) {
            const nextSceneData = parseNextScene(event.target.dataset.nextScene);

             if (!nextSceneData) {
                 alert("錯誤：無效的下一個劇情或結局連結。請重新開始。");
                 showStartScreen();
                 return;
             }

            const { char: nextChar, id: nextId } = nextSceneData;
            const isEnding = nextId.startsWith('ending');

             if (isEnding) {
                 transitionScreens(gameScreen, endingScreen, () => {
                     renderEnding(currentChar, nextId); // Use currentChar for ending data lookup
                 });
             } else {
                 // Transition *within* the game screen to a new scene for the same character
                 const gameContentElements = gameScreen.querySelectorAll('#story-text, .historical-fact, #options-container');

                 // Step 1: Start fade out and slide up animation for current content
                 gameContentElements.forEach(el => {
                      el.style.opacity = '0';
                      el.style.transform = 'translateY(-20px)'; /* Adjusted slide up */
                 });

                 // Step 2: Wait for fade out duration (0.8s), then update content and trigger fade in
                 setTimeout(() => {
                     // Update content for the next scene
                     renderScene(currentChar, nextId);

                     // Force reflow AFTER content update but BEFORE triggering the next animation
                     void gameScreen.offsetHeight;

                     // Step 3: Start fade in and slide down animation for the NEW content
                     const newGameContentElements = gameScreen.querySelectorAll('#story-text, .historical-fact, #options-container');

                     newGameContentElements.forEach(el => {
                         // Set initial state for fade-in animation
                         el.style.opacity = '0';
                         el.style.transform = 'translateY(20px)'; /* Adjusted slide down */
                     });

                     // Force reflow *again* to apply the initial state for fade-in before animating
                     void gameScreen.offsetHeight;

                     // Trigger fade-in and slide up animation
                     newGameContentElements.forEach(el => {
                         el.style.opacity = '1';
                         el.style.transform = 'translateY(0)'; // Animate to final position
                     });

                 }, 900); // Wait time (slightly longer than 0.8s transition)
             }
        }

        // 顯示開始畫面並隱藏其他畫面
        function showStartScreen() {
            currentChar = null;
            currentSceneId = null;
            transitionScreens(gameScreen.classList.contains('hidden') ? endingScreen : gameScreen, startScreen);
        }

        // 處理角色選擇
        function handleCharacterSelect(event) {
            const selectedChar = event.target.dataset.character;
            currentChar = selectedChar;

            transitionScreens(startScreen, gameScreen, () => {
                // After gameScreen is shown, render the first scene
                renderScene(currentChar, 'scene1');

                 // Trigger the initial fade-in for game screen content after rendering
                 const gameContentElements = gameScreen.querySelectorAll('#story-text, .historical-fact, #options-container');
                 gameContentElements.forEach(el => {
                      el.style.opacity = '0'; // Set initial state before reflow
                      el.style.transform = 'translateY(20px)'; /* Adjusted slide down */
                 });
                 void gameScreen.offsetHeight; // Reflow

                  gameContentElements.forEach(el => {
                      el.style.opacity = '1'; // Trigger animation
                      el.style.transform = 'translateY(0)';
                 });
            });
        }

        // 獲取角色中文名稱
        function getCharacterName(charKey) {
            switch(charKey) {
                case 'student': return '大學生';
                case 'reporter': return '記者';
                case 'teacher': return '老師';
                default: return '';
            }
        }

        // 初始化：綁定事件監聽器並顯示開始畫面
        function initializeGame() {
            // Bind character selection buttons
            document.querySelectorAll('#start-screen button').forEach(button => {
                button.addEventListener('click', handleCharacterSelect);
            });

            // Bind back to start button
            backToStartButton.addEventListener('click', showStartScreen);

            // Initially hide game and ending screens
            gameScreen.classList.add('hidden');
            endingScreen.classList.add('hidden');
            startScreen.classList.remove('hidden'); // Ensure start screen is visible initially

            // Apply transition property after initial display state is set
            // This prevents transitions on page load
             setTimeout(() => {
                // Apply transitions for main screen switching
                document.querySelectorAll('.screen').forEach(screen => {
                     screen.style.transition = 'opacity 1s ease-in-out, transform 1s ease-in-out'; /* Faster */
                });

                // Apply transitions for content elements *within* the game screen (for internal scene changes)
                const gameContentElements = gameScreen.querySelectorAll('#story-text, .historical-fact, #options-container');
                gameContentElements.forEach(el => {
                     el.style.transition = 'opacity 0.8s ease-in-out, transform 0.8s ease-in-out'; /* Faster */
                });

                 // Apply transition for button hover/active states
                 document.querySelectorAll('button').forEach(button => {
                     button.style.transition = 'background-color 0.2s ease, transform 0.1s ease'; /* Faster hover */
                 });


             }, 50); // Small delay
        }

        // 頁面加載完成後執行初始化
        window.addEventListener('load', initializeGame);

    </script>

</body>
</html>
